name: Refresh and deploy prototype

# The prototype itself is static HTML. CI regenerates the derived review
# artifacts in the runner workspace and deploys that exact workspace once.
# It deliberately never commits generated files back to main: a second push
# used to cancel the deployment that triggered it and queue another Pages run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are serialized. Let an active deployment finish; GitHub
# keeps the newest queued run and discards obsolete queued runs for this group.
concurrency:
  # The original `pages` group contains a GitHub-side orphaned deployment
  # that ignores both regular and forced cancellation requests.
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build-changelog.js refuses a shallow history rather than publishing
          # a changelog that silently looks complete but is truncated.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install prototype tools
        working-directory: tools
        run: npm ci

      - name: Regenerate derived artifacts
        env:
          # ubuntu-latest supplies this Chrome binary for puppeteer-core.
          CHROME_PATH: /usr/bin/google-chrome
          # The Figma export launches one Chrome process per frame. Serializing
          # those processes avoids memory pressure making heavy pages cross the
          # per-frame timeout nondeterministically.
          JOBS: '1'
          FRAME_TIMEOUT_MS: '300000'
          REFRESH_DUMP_TIMEOUT_MS: '1800000'
        run: node tools/refresh.js

      - name: Remove build-only dependencies
        shell: bash
        run: |
          target="${GITHUB_WORKSPACE:?}/tools/node_modules"
          test "$PWD" = "$GITHUB_WORKSPACE"
          test "$target" = "$PWD/tools/node_modules"
          test -d "$target"
          test ! -L "$target"
          rm -rf -- "$target"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Include the generated, gitignored use-case documentation and
          # captures created above. upload-pages-artifact excludes .git.
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
